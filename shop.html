<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 220vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #32134f 0%,
                #3d185d 45%,
                #4a1d6b 100%
            );

            overflow-x: hidden;
        }

        /* TITLE AREA */

        .top {
            height: 45vh;
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;

            font-size: 52px;
            font-weight: bold;

            text-align: center;
        }

        /* CONTENT */

        .content {
            min-height: 130vh;
            padding: 30px 40px;
        }

        /* SHOP LABEL */

        .shop-label {
            display: inline-block;

            padding: 12px 25px;

            background: #4a4a4a;
            color: black;

            border-radius: 8px;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 25px;
        }

        /* SHOP GRID */

        .shop-grid {
            display: grid;

            grid-template-columns: repeat(4, 100px);

            gap: 15px;

            width: max-content;
        }

        .shop-square {
            width: 100px;
            height: 100px;

            background: #3f3f3f;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: black;

            font-size: 14px;
            font-weight: bold;

            cursor: default;
        }

        /* OG BLOCK */

        .og-block {
            text-align: center;
        }

        .lock {
            display: block;

            font-size: 28px;

            margin-bottom: 5px;
        }

        /* RED X */

        .locked-x {
            color: red;

            font-size: 45px;
            font-weight: bold;
        }

        /* BACK BUTTON */

        .back-container {
            height: 25vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            padding: 14px 45px;

            background: rgba(180, 180, 180, 0.35);
            color: black;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;

            font-size: 20px;
            font-weight: bold;

            text-decoration: none;
            text-align: center;

            backdrop-filter: blur(5px);

            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(200, 200, 200, 0.5);
            transform: scale(1.05);
        }

        /* BOTTOM */

        .bottom {
            height: 35vh;

            background: linear-gradient(
                to bottom,
                #4a1d6b 0%,
                #3d185d 60%,
                #32134f 100%
            );
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .title {
                font-size: 40px;
            }

            .content {
                padding: 30px 25px;
                min-height: 130vh;
            }

            .shop-grid {
                grid-template-columns: repeat(4, 70px);
                gap: 10px;
            }

            .shop-square {
                width: 70px;
                height: 70px;
            }

            .locked-x {
                font-size: 32px;
            }

            .lock {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP -->

    <div class="top">

        <div class="title">
            SHOP
        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">

        <div class="shop-label">
            SHOP
        </div>


        <div class="shop-grid">

            <!-- FIRST ROW -->

            <div class="shop-square og-block">
                <div>
                    <span class="lock">🔒</span>
                    OG BLOCK
                </div>
            </div>

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>


            <!-- SECOND ROW -->

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>

            <div class="shop-square og-block">
                <div>
                    <span class="lock">🔒</span>
                    OG BLOCK
                </div>
            </div>

            <div class="shop-square og-block">
                <div>
                    <span class="lock">🔒</span>
                    OG BLOCK
                </div>
            </div>

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>


            <!-- THIRD ROW -->

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>

            <div class="shop-square">
                <span class="locked-x">X</span>
            </div>

        </div>

    </div>


    <!-- BACK BUTTON -->

    <div class="back-container">

        <a href="more.html" class="back-button">
            BACK
        </a>

    </div>


    <!-- BOTTOM -->

    <div class="bottom"></div>

</body>
</html>
