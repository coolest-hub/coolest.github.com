<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 220vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #32134f 0%,
                #3d185d 45%,
                #4a1d6b 100%
            );

            overflow-x: hidden;
        }

        /* TITLE */

        .top {
            height: 45vh;
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;

            font-size: 52px;
            font-weight: bold;

            text-align: center;
        }

        /* CONTENT */

        .content {
            min-height: 130vh;

            padding: 30px 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SHOP LABEL */

        .shop-label {
            color: black;

            font-size: 32px;
            font-weight: bold;

            margin-bottom: 30px;
        }

        /* SHOP GRID */

        .shop-grid {
            display: grid;

            grid-template-columns: repeat(4, 175px);

            gap: 15px 27px;

            justify-content: center;
        }

        /* ALL SHOP BUTTONS */

        .shop-square {
            width: 175px;
            height: 175px;

            background: #3f3f3f;

            border: none;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            padding: 0;
        }

        .shop-square:hover {
            background: #3f3f3f;
        }

        .shop-square:active {
            transform: none;
        }

        /* RED X */

        .locked-x {
            color: red;

            font-size: 72px;
            font-weight: normal;

            line-height: 1;
        }

        /* THIRD ROW */

        .third-row {
            grid-column: 1 / 5;

            display: flex;
            justify-content: center;

            gap: 27px;
        }

        /* CODE MACHINE */

        .code-machine {
            margin-top: 70px;

            width: 400px;
        }

        .code-machine-title {
            color: black;

            font-size: 32px;
            font-weight: bold;

            margin-bottom: 15px;

            text-align: center;
        }

        .code-machine-box {
            width: 100%;
            height: 120px;

            background: #3f3f3f;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: black;

            font-size: 22px;
            font-weight: bold;
        }

        /* BACK BUTTON */

        .back-container {
            height: 25vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            padding: 14px 45px;

            background: rgba(180, 180, 180, 0.35);

            color: black;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;

            font-size: 20px;
            font-weight: bold;

            text-decoration: none;
            text-align: center;

            backdrop-filter: blur(5px);

            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(200, 200, 200, 0.5);

            transform: scale(1.05);
        }

        /* BOTTOM */

        .bottom {
            height: 35vh;

            background: linear-gradient(
                to bottom,
                #4a1d6b 0%,
                #3d185d 60%,
                #32134f 100%
            );
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .shop-grid {
                grid-template-columns: repeat(4, 120px);

                gap: 12px 12px;
            }

            .shop-square {
                width: 120px;
                height: 120px;
            }

            .locked-x {
                font-size: 55px;
            }

            .third-row {
                gap: 12px;
            }
        }

        @media (max-width: 600px) {

            .title {
                font-size: 40px;
            }

            .content {
                padding: 30px 15px;
            }

            .shop-grid {
                grid-template-columns: repeat(4, 75px);

                gap: 10px 10px;
            }

            .shop-square {
                width: 75px;
                height: 75px;

                border-radius: 8px;
            }

            .locked-x {
                font-size: 38px;
            }

            .third-row {
                gap: 10px;
            }

            .code-machine {
                width: 280px;
            }

            .code-machine-title {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP -->

    <div class="top">

        <div class="title">
            SHOP
        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">

        <div class="shop-label">
            SHOP
        </div>


        <!-- SHOP GRID -->

        <div class="shop-grid">

            <!-- FIRST ROW -->

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>


            <!-- SECOND ROW -->

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>

            <button class="shop-square">
                <span class="locked-x">X</span>
            </button>


            <!-- THIRD ROW -->

            <div class="third-row">

                <button class="shop-square">
                    <span class="locked-x">X</span>
                </button>

                <button class="shop-square">
                    <span class="locked-x">X</span>
                </button>

            </div>

        </div>


        <!-- CODE MACHINE -->

        <div class="code-machine">

            <div class="code-machine-title">
                CODE MACHINE
            </div>

            <div class="code-machine-box">
                CODE MACHINE
            </div>

        </div>

    </div>


    <!-- BACK -->

    <div class="back-container">

        <a href="more.html" class="back-button">
            BACK
        </a>

    </div>


    <!-- BOTTOM -->

    <div class="bottom"></div>

</body>
</html>
