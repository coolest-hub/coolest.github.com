<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MORE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 220vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #32134f 0%,
                #3d185d 45%,
                #4a1d6b 100%
            );

            overflow-x: hidden;
        }

        /* TITLE AREA */

        .top {
            height: 45vh;
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;

            font-size: 52px;
            font-weight: bold;

            text-align: center;
        }

        /* CONTENT */

        .content {
            min-height: 130vh;
            padding: 30px 40px;
        }

        .currency {
            color: black;

            font-size: 32px;
            font-weight: bold;

            margin-top: 40px;
            margin-bottom: 35px;
        }

        /* CHIPS */

        .chips-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chips-image {
            width: 70px;
            height: 70px;

            border-radius: 8px;

            object-fit: cover;
        }

        .chips {
            color: black;

            font-size: 30px;
            font-weight: bold;
        }

        /* CODE STATUS */

        .code-status {
            margin-top: 30px;

            font-size: 22px;
            font-weight: bold;

            min-height: 28px;
        }

        .claimed {
            color: green;
        }

        .used {
            color: red;
        }

        /* BACK BUTTON */

        .back-container {
            height: 25vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            padding: 14px 45px;

            background: rgba(180, 180, 180, 0.35);
            color: black;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;

            font-size: 20px;
            font-weight: bold;

            text-decoration: none;
            text-align: center;

            backdrop-filter: blur(5px);

            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(200, 200, 200, 0.5);
            transform: scale(1.05);
        }

        /* BOTTOM */

        .bottom {
            height: 35vh;

            background: linear-gradient(
                to bottom,
                #4a1d6b 0%,
                #3d185d 60%,
                #32134f 100%
            );

            position: relative;
        }

        /* CODE BOX */

        .code-box {
            position: absolute;

            right: 25px;
            bottom: 25px;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .code-input {
            width: 180px;
            height: 42px;

            border: none;
            border-radius: 8px;

            padding: 0 12px;

            font-size: 16px;
            outline: none;
        }

        .check-button {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;
        }

        .check-button:hover {
            transform: scale(1.05);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .title {
                font-size: 40px;
            }

            .content {
                padding: 30px 25px;
                min-height: 130vh;
            }

            .currency {
                font-size: 28px;
            }

            .chips {
                font-size: 26px;
            }

            .chips-image {
                width: 60px;
                height: 60px;
            }

            .code-box {
                right: 15px;
                bottom: 15px;
            }

            .code-input {
                width: 150px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP -->

    <div class="top">

        <div class="title">
            MORE
        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">

        <div class="currency">
            CURRENCYS:
        </div>

        <div class="chips-row">

            <img
                src="chipy.png"
                class="chips-image"
                alt="Chips"
            >

            <div class="chips">
                CHIPS: <span id="chipsAmount">0</span>
            </div>

        </div>

        <div id="codeStatus" class="code-status"></div>

    </div>


    <!-- BACK BUTTON -->

    <div class="back-container">

        <a href="index.html" class="back-button">
            BACK
        </a>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <div class="code-box">

            <input
                type="text"
                id="codeInput"
                class="code-input"
                placeholder="Enter code..."
            >

            <button
                class="check-button"
                onclick="claimCode()"
            >
                ✓
            </button>

        </div>

    </div>


    <script>

        /* CHIPS */

        let chips = localStorage.getItem("chips");

        if (chips === null) {
            chips = 0;
            localStorage.setItem("chips", chips);
        }

        chips = Number(chips);

        document.getElementById("chipsAmount").textContent = chips;


        /* CODE */

        const correctCode = "25CHIP.CODE";

        let codeClaimed = localStorage.getItem("25CHIP.CODE.claimed");

        const status = document.getElementById("codeStatus");


        /* Show saved status */

        if (codeClaimed === "true") {
            status.textContent = "CODE CLAIMED";
            status.className = "code-status claimed";
        }


        /* Claim code */

        function claimCode() {

            const enteredCode =
                document.getElementById("codeInput").value.trim();

            /* Already used */

            if (codeClaimed === "true") {

                status.textContent = "CODE USED";
                status.className = "code-status used";

                return;
            }


            /* Correct code */

            if (enteredCode === correctCode) {

                chips += 25;

                localStorage.setItem("chips", chips);

                localStorage.setItem(
                    "25CHIP.CODE.claimed",
                    "true"
                );

                codeClaimed = "true";

                document.getElementById("chipsAmount").textContent = chips;

                status.textContent = "CODE CLAIMED";
                status.className = "code-status claimed";

            } else {

                status.textContent = "INVALID CODE";
                status.className = "code-status used";

            }
        }

    </script>

</body>
</html>
