<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COOLEST</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 160vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #32134f 0%,
                #3d185d 45%,
                #4a1d6b 100%
            );

            overflow-x: hidden;
        }

        /* TITLE AREA */

        .top {
            height: 45vh;
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;

            font-size: 52px;
            font-weight: bold;

            text-align: center;
        }

        /* CONTENT */

        .content {
            min-height: 80vh;

            padding: 50px 40px;
        }

        /* BOTTOM */

        .bottom {
            height: 35vh;

            background: linear-gradient(
                to bottom,
                #4a1d6b 0%,
                #3d185d 60%,
                #32134f 100%
            );
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .title {
                font-size: 40px;
            }

            .content {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP -->

    <div class="top">

        <div class="title">
            COOLEST
        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">

    </div>


    <!-- BOTTOM -->

    <div class="bottom"></div>

</body>
</html>
